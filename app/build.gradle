plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"
}

android {
    namespace "com.example.ogdenkids"
    // E4c：compile/target 35；Kotlin 2 + Compose 插件
    compileSdk 35

    defaultConfig {
        applicationId "com.skivein.ogdenbasic"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        resConfigs "zh-rCN"

        // NDK 29 默认更好支持 16KB；CMake 已加 max-page-size=16384
        ndkVersion "29.0.14033849"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

ksp {
    arg("room.schemaLocation", file("$projectDir/schemas").absolutePath.replace('\\', '/'))
}
